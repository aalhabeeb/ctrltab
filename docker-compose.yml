# Lokale dev-opzet. Eén container: Express serveert de API én de frontend.
services:
  ctrltab:
    build: .
    container_name: ctrltab
    restart: unless-stopped
    ports:
      - "8090:3000"
    volumes:
      - ctrltab-data:/app/data
    environment:
      - NODE_ENV=production
      - DB_PATH=/app/data/ctrltab.db
      - JWT_SECRET=${JWT_SECRET:-please-change-this-secret}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}

volumes:
  ctrltab-data:
    driver: local
