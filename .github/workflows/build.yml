# Bouwt de ctrlTAB-image en publiceert hem naar GHCR en Docker Hub.
#
# Eén image: Express serveert zowel de API als de statische frontend, dus de
# aparte nginx-image van upstream is vervallen.
#
# Tags: elke push naar main levert `main`, `latest` en `sha-<commit>`; een push naar
# de dev-branch levert `dev` en `sha-<commit>` en RAAKT `latest` NIET (die hangt aan
# is_default_branch). Zo kun je een wijziging draaien en testen zonder dat iemand die
# `latest` pullt hem ongevraagd binnenkrijgt. Een git-tag
# `v1.2.0` levert daarnaast `1.2.0` en `1.2`. `latest` is er voor wie hem met de
# hand wil draaien; de Kubernetes-manifests in de k3s-repo wijzen bewust naar een
# onveranderlijke tag, zodat terugrollen neerkomt op het terugzetten van een regel
# in Git.
#
# GHCR is de bron waar het cluster uit trekt (geen pull-rate-limits). Docker Hub is
# er voor distributie naar anderen: upstream publiceerde nooit een image.
#
# De Docker Hub-push schakelt zichzelf uit zolang het secret DOCKERHUB_TOKEN of de
# variabele DOCKERHUB_NAMESPACE ontbreekt; de GHCR-push draait dan gewoon door. Zo
# faalt de workflow niet in een fork of voordat het token gezet is.
#
# Pull requests bouwen wel, maar pushen niet. Dat is de vangnetfunctie: een
# Renovate-PR die de Node-major of een native dependency ophoogt, faalt hier
# zichtbaar in plaats van stilletjes in productie.

name: build

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # secrets zijn niet bruikbaar in een `if` van een step; via job-level env wel.
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_TOKEN != '' && vars.DOCKERHUB_NAMESPACE != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Inloggen bij GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inloggen bij Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags en labels bepalen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            name=docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/ctrltab,enable=${{ env.DOCKERHUB_ENABLED == 'true' }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          # Zonder deze overrides neemt metadata-action de GitHub-repo-omschrijving
          # over als image-beschrijving; die is Nederlands, terwijl wie de image
          # pullt daar niets aan heeft. Titel en documentatie-URL meteen mee.
          labels: |
            org.opencontainers.image.title=ctrlTAB
            org.opencontainers.image.description=Self-hosted bookmark and link manager - one container, Express + SQLite
            org.opencontainers.image.documentation=https://github.com/aalhabeeb/ctrltab#readme
          # Annotations komen standaard uit de GitHub-repo-omschrijving (Nederlands);
          # gelijktrekken met de labels hierboven.
          annotations: |
            org.opencontainers.image.title=ctrlTAB
            org.opencontainers.image.description=Self-hosted bookmark and link manager - one container, Express + SQLite
            org.opencontainers.image.documentation=https://github.com/aalhabeeb/ctrltab#readme


      # De build zelf bewijst alleen dat de image te bouwen valt. Dat een vergeten
      # COPY-regel pas bij het starten opvalt (MODULE_NOT_FOUND op oidc.js) kost je
      # anders een kapotte uitrol. Dus: image eerst lokaal laden, echt starten en
      # bevragen. De push hieronder komt daarna uit dezelfde cache en kost niets.
      - name: Image bouwen voor de rookproef
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ctrltab:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Rookproef - container echt starten
        run: |
          set -e
          docker run -d --name ctrltab-ci -p 3000:3000 -e JWT_SECRET=ci-test ctrltab:ci
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::error::de container kwam niet omhoog"
            docker logs ctrltab-ci || true
            docker rm -f ctrltab-ci || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:3000/ >/dev/null || {
            echo "::error::de frontend wordt niet geserveerd"
            docker logs ctrltab-ci || true
            docker rm -f ctrltab-ci || true
            exit 1
          }
          echo "health en frontend beantwoord; containerlog:"
          docker logs ctrltab-ci
          docker rm -f ctrltab-ci
      - name: Bouwen en pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# NIET automatiseren: de Docker Hub-overview.
#
# Geprobeerd met peter-evans/dockerhub-description. Inloggen met het access token
# lukt, maar de PATCH op de repository geeft `Forbidden`: de Hub-API staat het
# wijzigen van de beschrijving alleen toe met het ACCOUNTWACHTWOORD, niet met een
# token. Dat wachtwoord in een GitHub-secret zetten maakt de blast radius van dat
# secret je hele Docker Hub-account, voor een stukje tekst.
#
# De overview staat daarom met de hand op Docker Hub; docs/dockerhub.md is de bron
# van die tekst. Wijzig je dat bestand, plak hem dan opnieuw.
