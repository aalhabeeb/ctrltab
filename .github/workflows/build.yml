# Bouwt de api- en web-image en publiceert ze naar GHCR en Docker Hub.
#
# Tags: elke push naar main levert `main` en `sha-<commit>`; een git-tag `v1.2.0`
# levert daarnaast `1.2.0` en `1.2`. Bewust GEEN `latest`: de Kubernetes-manifests
# in de k3s-repo verwijzen naar een onveranderlijke tag, zodat terugrollen
# neerkomt op het terugzetten van een regel in Git.
#
# GHCR is de bron waar het cluster uit trekt (geen pull-rate-limits). Docker Hub is
# er voor distributie naar anderen: upstream publiceerde nooit een image, dus dit
# is de enige kant-en-klare ctrlTAB-image die er is.
#
# De Docker Hub-push schakelt zichzelf uit zolang het secret DOCKERHUB_TOKEN of de
# variabele DOCKERHUB_NAMESPACE ontbreekt; de GHCR-push draait dan gewoon door. Zo
# faalt de workflow niet in een fork of voordat het token gezet is.
#
# Pull requests bouwen wel, maar pushen niet. Dat is de vangnetfunctie: een
# Renovate-PR die de Node-major of een native dependency ophoogt, faalt hier
# zichtbaar in plaats van stilletjes in productie.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # secrets zijn niet bruikbaar in een `if` van een step; via job-level env wel.
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_TOKEN != '' && vars.DOCKERHUB_NAMESPACE != '' }}
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Inloggen bij GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inloggen bij Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags en labels bepalen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}-${{ matrix.component }}
            name=docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/ctrltab-${{ matrix.component }},enable=${{ env.DOCKERHUB_ENABLED == 'true' }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Bouwen en pushen
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
