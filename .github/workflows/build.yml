# Bouwt de api- en web-image en publiceert ze naar GHCR.
#
# Tags: elke push naar main levert `main` en `sha-<commit>`; een git-tag `v1.2.0`
# levert daarnaast `1.2.0` en `1.2`. Bewust GEEN `latest`: de Kubernetes-manifests
# in de k3s-repo verwijzen naar een onveranderlijke tag, zodat terugrollen
# neerkomt op het terugzetten van een regel in Git.
#
# Pull requests bouwen wel, maar pushen niet. Dat is de vangnetfunctie: een
# Renovate-PR die de Node-major of een native dependency ophoogt, faalt hier
# zichtbaar in plaats van stilletjes in productie.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Inloggen bij GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags en labels bepalen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Bouwen en pushen
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
