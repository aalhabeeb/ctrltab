# Bouwt de ctrlTAB-image en publiceert hem naar GHCR en Docker Hub.
#
# Eén image: Express serveert zowel de API als de statische frontend, dus de
# aparte nginx-image van upstream is vervallen.
#
# Tags: elke push naar main levert `main`, `latest` en `sha-<commit>`; een git-tag
# `v1.2.0` levert daarnaast `1.2.0` en `1.2`. `latest` is er voor wie hem met de
# hand wil draaien; de Kubernetes-manifests in de k3s-repo wijzen bewust naar een
# onveranderlijke tag, zodat terugrollen neerkomt op het terugzetten van een regel
# in Git.
#
# GHCR is de bron waar het cluster uit trekt (geen pull-rate-limits). Docker Hub is
# er voor distributie naar anderen: upstream publiceerde nooit een image.
#
# De Docker Hub-push schakelt zichzelf uit zolang het secret DOCKERHUB_TOKEN of de
# variabele DOCKERHUB_NAMESPACE ontbreekt; de GHCR-push draait dan gewoon door. Zo
# faalt de workflow niet in een fork of voordat het token gezet is.
#
# Pull requests bouwen wel, maar pushen niet. Dat is de vangnetfunctie: een
# Renovate-PR die de Node-major of een native dependency ophoogt, faalt hier
# zichtbaar in plaats van stilletjes in productie.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # secrets zijn niet bruikbaar in een `if` van een step; via job-level env wel.
      DOCKERHUB_ENABLED: ${{ secrets.DOCKERHUB_TOKEN != '' && vars.DOCKERHUB_NAMESPACE != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Inloggen bij GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inloggen bij Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags en labels bepalen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            name=docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/ctrltab,enable=${{ env.DOCKERHUB_ENABLED == 'true' }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          # Zonder deze overrides neemt metadata-action de GitHub-repo-omschrijving
          # over als image-beschrijving; die is Nederlands, terwijl wie de image
          # pullt daar niets aan heeft. Titel en documentatie-URL meteen mee.
          labels: |
            org.opencontainers.image.title=ctrlTAB
            org.opencontainers.image.description=Self-hosted bookmark and link manager - one container, Express + SQLite
            org.opencontainers.image.documentation=https://github.com/aalhabeeb/ctrltab#readme

      - name: Bouwen en pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # De overview-pagina van een Docker Hub-repo komt niet uit de image mee; die
      # moet apart via de Hub-API gezet worden. docs/dockerhub.md is daarvoor
      # geschreven en niet de GitHub-README: dat publiek wil weten hoe je de image
      # draait, niet wat er ten opzichte van upstream veranderd is.
      #
      # continue-on-error: het publiceren van de image is belangrijker dan de
      # beschrijving. Accepteert de Hub-API het access token niet, dan faalt alleen
      # deze stap en is de tekst met de hand te plakken.
      - name: Docker Hub-overview bijwerken
        if: github.event_name != 'pull_request' && env.DOCKERHUB_ENABLED == 'true'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_NAMESPACE }}/ctrltab
          short-description: "Self-hosted bookmark and link manager - one container, Express + SQLite"
          readme-filepath: docs/dockerhub.md
